name: web-media-fetcher-live

on:
  pull_request:
    paths:
      - ".github/workflows/web-media-fetcher-live.yml"
      - "tools/web-media-fetcher/**"
  workflow_dispatch:

jobs:
  live-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r tools/web-media-fetcher/requirements.txt
      - name: Fetch requested media
        run: |
          mkdir -p /tmp/media
          python tools/web-media-fetcher/web_media_fetcher.py -i tools/web-media-fetcher/request-urls.txt -d /tmp/media
          python - <<'PY'
          from pathlib import Path
          files=[p for p in Path('/tmp/media').iterdir() if p.is_file()]
          assert files, 'no media files downloaded'
          print('MEDIA LIVE PASS')
          for p in files:
              head=p.read_bytes()[:16]
              print('file=', p.name, 'bytes=', p.stat().st_size, 'magic=', head.hex())
          PY
      - name: Upload media output
        uses: actions/upload-artifact@v4
        with:
          name: web-media-fetcher-live-output
          path: /tmp/media/
          if-no-files-found: error
          retention-days: 1
