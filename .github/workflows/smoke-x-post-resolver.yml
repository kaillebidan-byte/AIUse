name: x-post-media-bridge

on:
  pull_request:
    paths:
      - ".github/workflows/smoke-x-post-resolver.yml"
      - "tools/x-post-resolver/**"

jobs:
  live-media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r tools/x-post-resolver/requirements.txt
      - name: Resolve and download public video posts
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          import requests

          urls=[x.strip() for x in Path('tools/x-post-resolver/request-urls.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          out=Path('/tmp/x-post-media'); out.mkdir(parents=True, exist_ok=True)
          manifest=[]

          def raw_mp4(status_id):
              r=requests.get(f'https://api.fxtwitter.com/2/status/{status_id}', timeout=20)
              r.raise_for_status()
              data=r.json()
              found=[]
              def walk(x):
                  if isinstance(x, dict):
                      if x.get('content_type') == 'video/mp4' and isinstance(x.get('url'), str):
                          found.append((int(x.get('bitrate') or 0), x['url']))
                      for v in x.values(): walk(v)
                  elif isinstance(x, list):
                      for v in x: walk(v)
              walk(data)
              if not found:
                  return None
              found.sort(key=lambda z:z[0])
              return found[-1][1]

          for i,u in enumerate(urls,1):
              p=out/f'post_{i}.json'
              subprocess.run(['python','tools/x-post-resolver/x_post_resolver.py',u,'--json','-o',str(p)],check=True)
              d=json.loads(p.read_text(encoding='utf-8'))
              sid=re.search(r'/status/(\d+)',u).group(1)
              assert d.get('id') == sid, d
              media=d.get('media') or []
              candidates=[m.get('url') for m in media if isinstance(m,dict) and isinstance(m.get('url'),str) and ('video.twimg.com' in m['url'] or re.search(r'\.mp4(?:$|[?])',m['url']))]
              video_url=candidates[0] if candidates else raw_mp4(sid)
              assert video_url, {'url':u,'normalized_media':media}
              r=requests.get(video_url,timeout=30)
              r.raise_for_status()
              ctype=(r.headers.get('content-type') or '').split(';',1)[0].strip().lower()
              assert ctype.startswith('video/') or '.mp4' in video_url, (ctype,video_url)
              f=out/f'video_{i}.mp4'; f.write_bytes(r.content)
              manifest.append({'index':i,'post_url':u,'post_text':d.get('text'),'author':d.get('author'),'file':f.name,'media_url':video_url,'content_type':ctype,'bytes':len(r.content)})
              print('PASS', i, u, len(r.content), video_url)

          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload X media artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-2d-video-batch
          path: /tmp/x-post-media/
          if-no-files-found: error
          retention-days: 1
