name: smoke-x-post-resolver

on:
  push:
    paths:
      - ".github/workflows/smoke-x-post-resolver.yml"
      - "tools/x-post-resolver/**"
  pull_request:
    paths:
      - ".github/workflows/smoke-x-post-resolver.yml"
      - "tools/x-post-resolver/**"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r tools/x-post-resolver/requirements.txt
      - name: Resolve live Azur Lane official X post
        run: |
          python tools/x-post-resolver/x_post_resolver.py \
            "https://x.com/azurlane_staff/status/2086709129742028826" \
            --json -o /tmp/x-post.json
          cat /tmp/x-post.json
      - name: Assert normalized output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/x-post.json').read_text(encoding='utf-8'))
          assert d['source'] == 'fxtwitter-v2', d
          assert d['id'] == '2086709129742028826', d
          assert d['author']['screen_name'] == 'azurlane_staff', d
          assert d.get('text'), d
          photos=[m for m in (d.get('media') or []) if m.get('type') == 'photo' and m.get('url')]
          assert len(photos) >= 2, d
          print('SMOKE PASS')
          print('author=', d['author']['screen_name'])
          print('photo_count=', len(photos))
          for i,m in enumerate(photos,1):
              print(f"photo_{i}=", m.get('url'))
          PY
      - name: Download resolved photo media
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          d=json.loads(Path('/tmp/x-post.json').read_text(encoding='utf-8'))
          out=Path('/tmp/x-post-media')
          out.mkdir(parents=True, exist_ok=True)
          photos=[m for m in (d.get('media') or []) if m.get('type') == 'photo' and m.get('url')]
          manifest=[]
          for i,m in enumerate(photos,1):
              r=requests.get(m['url'], timeout=30)
              r.raise_for_status()
              ctype=(r.headers.get('content-type') or '').split(';',1)[0].strip().lower()
              ext={
                  'image/jpeg': '.jpg',
                  'image/png': '.png',
                  'image/webp': '.webp',
                  'image/gif': '.gif',
              }.get(ctype, '.bin')
              p=out / f'photo_{i}{ext}'
              p.write_bytes(r.content)
              manifest.append({'file':p.name,'url':m['url'],'content_type':ctype,'bytes':len(r.content)})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'post.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print((out/'manifest.json').read_text(encoding='utf-8'))
          PY
      - name: Upload smoke media artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-post-resolver-live-media
          path: /tmp/x-post-media/
          if-no-files-found: error
          retention-days: 1
