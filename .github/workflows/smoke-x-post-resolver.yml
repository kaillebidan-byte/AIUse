name: x-post-media-bridge

on:
  push:
    paths:
      - ".github/workflows/smoke-x-post-resolver.yml"
      - "tools/x-post-resolver/**"
  pull_request:
    paths:
      - ".github/workflows/smoke-x-post-resolver.yml"
      - "tools/x-post-resolver/**"
  workflow_dispatch:
    inputs:
      x_url:
        description: "Public X/Twitter status URL; blank uses tools/x-post-resolver/request-url.txt"
        required: false
        type: string

jobs:
  live-media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r tools/x-post-resolver/requirements.txt
      - name: Resolve requested X post
        env:
          DISPATCH_URL: ${{ github.event.inputs.x_url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          u=(os.environ.get('DISPATCH_URL') or '').strip()
          if not u:
              u=Path('tools/x-post-resolver/request-url.txt').read_text(encoding='utf-8').strip()
          if not u:
              raise SystemExit('No X URL supplied')
          Path('/tmp/x-url.txt').write_text(u, encoding='utf-8')
          print('request_url=', u)
          PY
          python tools/x-post-resolver/x_post_resolver.py \
            "$(cat /tmp/x-url.txt)" \
            --json -o /tmp/x-post.json
          cat /tmp/x-post.json
      - name: Assert normalized media output
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('/tmp/x-post.json').read_text(encoding='utf-8'))
          u=Path('/tmp/x-url.txt').read_text(encoding='utf-8').strip()
          m=re.search(r'/status/(\d+)',u)
          assert m, u
          assert d['id'] == m.group(1), d
          assert d.get('text'), d
          assert (d.get('author') or {}).get('screen_name'), d
          media=[m for m in (d.get('media') or []) if m.get('url')]
          assert media, d
          print('BRIDGE INPUT PASS')
          print('author=', d['author']['screen_name'])
          print('media_count=', len(media))
          print('media_types=', [m.get('type') for m in media])
          PY
      - name: Download resolved media
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          d=json.loads(Path('/tmp/x-post.json').read_text(encoding='utf-8'))
          out=Path('/tmp/x-post-media')
          out.mkdir(parents=True, exist_ok=True)
          media=[m for m in (d.get('media') or []) if m.get('url')]
          manifest=[]
          extmap={
              'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/gif': '.gif',
              'video/mp4': '.mp4', 'video/webm': '.webm', 'application/vnd.apple.mpegurl': '.m3u8',
          }
          for i,m in enumerate(media,1):
              r=requests.get(m['url'], timeout=30)
              r.raise_for_status()
              ctype=(r.headers.get('content-type') or '').split(';',1)[0].strip().lower()
              ext=extmap.get(ctype, '.bin')
              p=out / f'media_{i}{ext}'
              p.write_bytes(r.content)
              manifest.append({'file':p.name,'type':m.get('type'),'url':m['url'],'thumbnail_url':m.get('thumbnail_url'),'content_type':ctype,'bytes':len(r.content)})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'post.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'request-url.txt').write_text(Path('/tmp/x-url.txt').read_text(encoding='utf-8'),encoding='utf-8')
          print((out/'manifest.json').read_text(encoding='utf-8'))
          PY
      - name: Upload X media artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-post-resolver-live-media
          path: /tmp/x-post-media/
          if-no-files-found: error
          retention-days: 1
