name: assemble-inline-video-rplay

on:
  push:
    branches:
      - feat/chatgpt-inline-video-rplay
    paths:
      - '.github/workflows/assemble-inline-video-rplay.yml'
      - 'tools/chatgpt-inline-video-lite/.parts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assemble exact userscript
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          root = Path('tools/chatgpt-inline-video-lite')
          parts = [p.read_text(encoding='utf-8') for p in sorted((root / '.parts').glob('*.part'))]
          if len(parts) != 8:
              raise SystemExit(f'expected 8 parts, got {len(parts)}')
          # Contents API staging added one trailing boundary-space in these two
          # chunks. Remove only those known staging bytes, then require exact hash.
          for index in (2, 4):
              if not parts[index].endswith(' '):
                  raise SystemExit(f'part {index} boundary mismatch')
              parts[index] = parts[index][:-1]
          data = ''.join(parts).encode('utf-8')
          expected = '5db16cd39d987de6cf4ea776478aac0084433d7131c644970fe56143b1720da5'
          actual = hashlib.sha256(data).hexdigest()
          print(f'sha256={actual}')
          if actual != expected:
              raise SystemExit(f'userscript hash mismatch: {actual}')
          (root / 'chatgpt-inline-video-lite.user.js').write_bytes(data)

      - name: JavaScript syntax check
        run: node --check tools/chatgpt-inline-video-lite/chatgpt-inline-video-lite.user.js

      - name: Publish assembled source and remove staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/chatgpt-inline-video-lite/chatgpt-inline-video-lite.user.js
          git rm -r tools/chatgpt-inline-video-lite/.parts
          git rm .github/workflows/assemble-inline-video-rplay.yml
          git commit -m 'feat: integrate RPLAY into ChatGPT Inline Video Lite'
          git push origin HEAD:feat/chatgpt-inline-video-rplay
